<style>
    * Portfolio Grid */
.portfolio-container {
    max-width: 100%;
    margin: 10px auto;
    background: white;
    padding: 40px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    justify-content: space-between;
    gap: 40px;
    flex-wrap: wrap;
}

.portfolio-gallery {
    margin: 50px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
}

.portfolio-gallery img {
    width: 150px;
    height: 150px;
    border-radius: 10px;
    transition: transform 0.3s ease-in-out;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}

.portfolio-gallery img:hover {
    transform: scale(1.05);
}
</style>
